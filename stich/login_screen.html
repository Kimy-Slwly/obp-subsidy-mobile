<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0b1326;color:#dae2fd;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error-container": "#ffdad6", "on-tertiary-fixed-variant": "#005236", "secondary": "#ffeaad", "surface-container-low": "#131b2e", "tertiary": "#4edea3", "error-container": "#93000a", "background": "#0b1326", "surface-variant": "#2d3449", "surface-container-lowest": "#060e20", "inverse-on-surface": "#283044", "primary-container": "#e31837", "text-primary": "#F8FAFC", "surface-bright": "#31394d", "on-background": "#dae2fd", "secondary-fixed-dim": "#edc200", "on-secondary-container": "#6a5600", "on-tertiary-fixed": "#002113", "on-primary-fixed-variant": "#92001d", "on-error": "#690005", "primary-fixed": "#ffdad8", "secondary-container": "#f7ca00", "surface-dim": "#0b1326", "on-surface-variant": "#e6bdbb", "primary": "#ffb3b1", "surface-card": "#1E293B", "text-muted": "#94A3B8", "tertiary-fixed": "#6ffbbe", "surface-border": "#334155", "primary-fixed-dim": "#ffb3b1", "secondary-fixed": "#ffe07f", "on-tertiary": "#003824", "status-error": "#EF4444", "surface-container": "#171f33", "tertiary-fixed-dim": "#4edea3", "outline": "#ad8886", "inverse-surface": "#dae2fd", "surface-tint": "#ffb3b1", "surface": "#0b1326", "on-tertiary-container": "eefff2", "on-primary-container": "#fffaf9", "outline-variant": "#5d3f3e", "on-secondary-fixed-variant": "#564500", "on-secondary-fixed": "#231b00", "on-surface": "#dae2fd", "surface-container-highest": "#2d3449", "inverse-primary": "#bf0029", "on-secondary": "#3c2f00", "tertiary-container": "#00845a", "on-primary": "#680011", "error": "#ffb4ab", "on-primary-fixed": "#410007", "surface-container-high": "#222a3d" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "margin": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "gutter": "1rem" }, fontFamily: { "body-md": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "numeric-display": ["Inter"], "headline-xl": ["Inter"], "body-sm": ["Inter"] }, fontSize: { "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "label-lg": ["16px", { lineHeight: "22px", letterSpacing: "0.01em", fontWeight: "600" }], "body-lg": ["18px", { lineHeight: "26px", fontWeight: "500" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.04em", fontWeight: "500" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "label-md": ["14px", { lineHeight: "18px", letterSpacing: "0.02em", fontWeight: "600" }], "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }], "numeric-display": ["36px", { lineHeight: "44px", letterSpacing: "0.02em", fontWeight: "800" }], "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface flex-grow"><div class="flex flex-col w-full px-margin py-space-lg justify-center min-h-[calc(100vh-4rem)] max-w-md mx-auto">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-space-md text-center">
<div class="relative flex items-center justify-center p-space-sm rounded-xl bg-surface-container-high shadow-sm mb-space-md">
<img alt="OBP Logo" class="h-14 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCo1kqHg2LysC15c2cYsE98ccvphnyXJnDiqIGgDiQNfyr4bVhBjNVgLTCSmvAh1HwrnQbNKu0-wrBy_3-dxZBlGCXkRNQeAF63HCto9rXeFObE0Dkh0dywOa5cFLojUsIj4WZRV-9gsVTjF0Z6vrMJpletdaYz7a7JF5DxTqrLzPcSnWY8jdTyjbF-GPIOKo7Lz0QEdvmJYERpHHkWY2MliBCwagvkXI3epwmoPMlg6Ih_H-T2ThLOjwl6qWQOhdp3W1A">
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight">OBP Driver Hub</h1>
<p class="font-body-sm text-body-sm text-text-muted mt-space-xs">Lorry Driver Access</p>
</div>
<!-- Operational Status Tag -->
<div class="flex items-center justify-center gap-space-xs bg-surface-container-low px-space-md py-1.5 rounded-full mx-auto mb-space-lg">
<span class="inline-block w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface">Fleet Portal Online • Night Mode Active</span>
</div>
<!-- Main Login Card -->
<div class="bg-surface-card rounded-xl p-space-lg shadow-xl relative overflow-hidden">
<!-- Subtle Industrial Accent Bar -->
<div class="absolute top-0 left-0 right-0 h-1 bg-primary-container"></div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Driver ID Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-primary flex items-center justify-between" for="driverId">
<span>Driver ID</span>
<span class="font-label-sm text-label-sm text-secondary-container tracking-wider uppercase font-semibold">Required</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-text-muted pointer-events-none select-none text-[22px]">badge</span>
<input autocomplete="username" class="w-full h-[52px] bg-surface-container-lowest text-text-primary font-body-md text-body-md pl-12 pr-4 rounded-lg placeholder-text-muted/60 transition focus:outline-none focus:bg-surface-container-low focus:text-text-primary" id="driverId" name="driverId" placeholder="e.g. DRV-8821" required="" style="letter-spacing: 0.03em;" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-primary flex items-center justify-between" for="password">
<span>Password</span>
<span class="font-label-sm text-label-sm text-text-muted">Security PIN / Key</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-text-muted pointer-events-none select-none text-[22px]">lock</span>
<input autocomplete="current-password" class="w-full h-[52px] bg-surface-container-lowest text-text-primary font-body-md text-body-md pl-12 pr-12 rounded-lg placeholder-text-muted/60 transition focus:outline-none focus:bg-surface-container-low focus:text-text-primary" id="password" name="password" placeholder="Enter password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 h-10 w-10 flex items-center justify-center rounded-lg text-text-muted hover:text-text-primary transition focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Shift Vehicle Quick Selection Indicator -->
<div class="bg-surface-container-lowest rounded-lg p-space-sm flex items-center justify-between">
<div class="flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-secondary-container">
<span class="material-symbols-outlined text-[20px]">local_shipping</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-text-muted uppercase tracking-wider">Assigned Fleet</span>
<span class="font-label-md text-label-md text-text-primary font-bold">Standard Forecourt HGV</span>
</div>
</div>
<span class="material-symbols-outlined text-tertiary text-[20px]" title="GPS Synced">verified</span>
</div>
<!-- Submit CTA Button -->
<button class="w-full h-[54px] mt-space-xs bg-primary-container hover:bg-on-primary active:bg-on-primary-fixed-variant text-on-primary-container font-label-lg text-label-lg rounded-xl shadow-lg flex items-center justify-center gap-space-sm transition duration-150 transform active:scale-[0.99] select-none" id="submitBtn" type="submit">
<span class="material-symbols-outlined text-[22px]">login</span>
<span>Login to Cabin</span>
</button>
</form>
</div>
<!-- Dispatcher Support Footnote -->
<div class="mt-space-lg text-center flex flex-col items-center gap-space-xs">
<p class="font-label-sm text-label-sm text-text-muted max-w-xs leading-relaxed">
      Contact Logistics Manager or Terminal Dispatch for password resets and lorry allocations.
    </p>
<div class="flex items-center gap-space-xs mt-space-xs text-text-muted/60">
<span class="material-symbols-outlined text-[16px]">headset_mic</span>
<span class="font-label-sm text-label-sm">Dispatch Support: +44 (0) 800 248 991</span>
</div>
</div>
</div>
<script>
  (function initLogin() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    window.handleLogin = function() {
      if (!submitBtn) return;
      const originalContent = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span>
        <span>Verifying Driver...</span>
      `;

      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px]">check_circle</span>
          <span>Access Granted</span>
        `;
        submitBtn.classList.remove('bg-primary-container');
        submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
      }, 1000);
    };
  })();
</script></main></body></html>
