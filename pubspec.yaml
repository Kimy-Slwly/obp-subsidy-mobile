name: obp_subsidy_mobile
description: "OBP Driver Hub - Targeted Fuel Subsidy (SKDS 2.0) and Fleet Management System for Lorry Drivers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Ecosystem (Shared backend with Next.js web dashboard)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Hardware integrations (OCR Odometer, Receipt Photo & GPS Location)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
